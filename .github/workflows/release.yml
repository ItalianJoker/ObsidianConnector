name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and pack
        run: |
          npm test
          npm run zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Obsidian Connector ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/obsidian-connector.zip
            dist/obsidian-connector-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
